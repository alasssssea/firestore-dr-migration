<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MongoDB → Firestore 迁移控制台</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 1.5rem; background: #0f1115; color: #e6e6e6; }
  h1 { font-size: 1.25rem; margin: 0 0 1rem; }
  .muted { color: #8a92a6; font-size: .85rem; }
  .jobs { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
  .job { background: #1a1f2b; border: 1px solid #2a3142; border-radius: .5rem; padding: .5rem .75rem; font-size: .85rem; }
  .state { font-weight: 600; }
  .state-done { color: #4ade80; } .state-failed { color: #f87171; }
  .state-live, .state-initial-load { color: #60a5fa; } .state-paused { color: #fbbf24; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #232838; }
  th { color: #8a92a6; font-weight: 500; }
  .bar { background: #232838; border-radius: .3rem; height: .6rem; overflow: hidden; min-width: 120px; }
  .bar > span { display: block; height: 100%; background: linear-gradient(90deg,#3b82f6,#22d3ee); }
  .controls button { background: #232838; color: #e6e6e6; border: 1px solid #2a3142; border-radius: .3rem; padding: .2rem .5rem; cursor: pointer; margin-right: .25rem; }
  .controls button:hover { background: #2a3142; }
  code { color: #93c5fd; }
</style>
</head>
<body>
  <h1>MongoDB → Firestore 迁移控制台</h1>
  <div class="muted" id="status">连接中…</div>
  <div class="jobs" id="jobs"></div>
  <table>
    <thead>
      <tr><th>库.集合</th><th>阶段</th><th>进度</th><th>%</th><th>吞吐</th><th>ETA</th><th>Lag</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

<script>
function fmtBytes(b) {
  if (b == null) return "-";
  const u = ["B","KB","MB","GB","TB","PB"]; let i = 0;
  while (b >= 1024 && i < u.length-1) { b /= 1024; i++; }
  return b.toFixed(i ? 1 : 0) + u[i];
}
function fmtDur(s) {
  if (s == null || s < 0) return "未知";
  s = Math.round(s);
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return (h?h+"h":"") + (m?m+"m":"") + sec + "s";
}
function control(job, action) {
  fetch("/api/control", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({job, action})}).catch(()=>{});
}
function render(st) {
  document.getElementById("status").textContent =
    (st.ready ? "✅ ready" : "⏳ not ready") + " · " + new Date(st.timestamp).toLocaleTimeString();

  const jobsEl = document.getElementById("jobs");
  jobsEl.innerHTML = "";
  (st.jobs||[]).forEach(j => {
    const d = document.createElement("div");
    d.className = "job";
    d.innerHTML = `<span class="state state-${j.state}">${j.state}</span> `
      + `<code>${j.id}</code> <span class="muted">${j.mode}</span>`
      + (j.error ? ` <span class="state-failed">${j.error}</span>` : "")
      + `<div class="controls" style="margin-top:.3rem">`
      + `<button onclick="control('${j.id}','pause')">暂停</button>`
      + `<button onclick="control('${j.id}','resume')">继续</button>`
      + `<button onclick="control('${j.id}','stop')">停止</button></div>`;
    jobsEl.appendChild(d);
  });

  const rows = document.getElementById("rows");
  rows.innerHTML = "";
  (st.collections||[]).forEach(c => {
    const s = c.snapshot || {};
    const pct = (s.totalBytes ? s.percentBytes : s.percentDocs) || 0;
    const tr = document.createElement("tr");
    tr.innerHTML =
      `<td>${c.database}.${c.collection}</td>` +
      `<td>${c.phase}</td>` +
      `<td><div class="bar"><span style="width:${pct.toFixed(1)}%"></span></div>` +
        `<span class="muted">${s.doneDocs||0}/${s.totalDocs||0}</span></td>` +
      `<td>${pct.toFixed(1)}%</td>` +
      `<td>${fmtBytes(s.bytesPerSec||0)}/s</td>` +
      `<td>${s.eta!=null && s.eta>=0 ? fmtDur(s.eta/1e9) + (s.etaReliable?"":" ⏳") : "未知"}</td>` +
      `<td>${c.lagSeconds!=null && c.lagSeconds>=0 ? fmtDur(c.lagSeconds) : "-"}</td>`;
    rows.appendChild(tr);
  });
}
function connect() {
  const es = new EventSource("/api/stream");
  es.onmessage = e => { try { render(JSON.parse(e.data)); } catch(_){} };
  es.onerror = () => { es.close(); setTimeout(connect, 2000); };
}
connect();
</script>
</body>
</html>
